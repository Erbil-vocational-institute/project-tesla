*{box-sizing:border-box}

.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}

.sub{color:var(--muted);margin:0 0 1rem;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.badge{font-size:.72rem;padding:.15rem .5rem;border-radius:99px;background:var(--blue-bg);color:var(--blue);margin-left:.5rem;text-transform:capitalize}

nav{display:flex;flex-direction:column;gap:.4rem}
@media(max-width:700px){nav{flex-direction:row;overflow-x:auto}}
nav button{text-align:left;background:var(--card);border:1px solid var(--line);padding:.6rem .8rem;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ann{border-left:5px solid var(--amber);background:var(--amber-bg);margin-bottom:.8rem}
.ann.hw{border-left-color:var(--blue);background:var(--blue-bg)}

.file{display:inline-block;margin-top:.5rem;font-size:.85rem;color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.err{color:var(--danger);font-size:.85rem;min-height:1.2rem;margin-bottom:.5rem}

.schedule-card{padding:0;overflow:hidden}
.schedule-brand{padding:1.2rem 1.25rem .9rem;border-bottom:1px solid var(--line)}
.schedule-institute{font-size:clamp(1.25rem,3vw,2rem);font-weight:800;letter-spacing:.04em}
.schedule-class{font-size:1.05rem;letter-spacing:.28em;margin-top:.2rem}

.schedule-table td{padding:1rem .5rem;border:1px solid var(--line);text-align:center;height:72px;font-size:1rem;background:var(--card)}

.cleaning-schedule-card{padding:0;overflow:hidden;background:#fff;color:#111}
.cleaning-brand{padding:1.1rem 1.25rem .9rem;border-bottom:1px solid #222}
.cleaning-institute{font-size:clamp(1.15rem,3vw,2rem);font-weight:900;letter-spacing:.025em}

.cleaning-title{font-size:1.15rem;letter-spacing:.12em;margin-top:.6rem;font-weight:900;border-top:2px solid #111;padding-top:.55rem}

.schedule-section-gap{height:1rem}

.schedule-table,.cleaning-table{min-width:0!important}

/* background picture + glass */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#050a14 var(--bgimg) center/cover no-repeat}
.card,header,nav button,.credits,input,textarea,select{-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.card,header,.credits{background:var(--card);border-color:var(--edge);box-shadow:0 8px 30px var(--shadow),inset 0 1px 0 rgba(255,255,255,.3)}
.card.ann{background:linear-gradient(var(--amber-bg),var(--amber-bg)),var(--card)}
.card.ann.hw{background:linear-gradient(var(--blue-bg),var(--blue-bg)),var(--card)}
.card.ann.test{background:linear-gradient(rgba(221,51,51,.16),rgba(221,51,51,.16)),var(--card)}
.card.ann.exam{background:rgba(255,255,255,.94);color:#1b2233}
.card.ann.exam .meta{color:#5d677c}
input,textarea,select{background:var(--field);border-color:var(--line)}
select option{background:var(--opt);color:var(--text)}
nav button{border-color:var(--edge)}
.btn.ghost{border-color:var(--line)}
.cleaning-schedule-card{background:var(--card);color:var(--text)}
.cleaning-brand{border-bottom-color:var(--line)}
.cleaning-title{border-top-color:var(--text)}
.schedule-table td,.cleaning-table td{background:transparent;color:var(--text);border-color:var(--line)}
.schedule-table th,.cleaning-table th{border-color:var(--line);background:rgba(23,26,29,.8);color:#fff}
.schedule-table td.today,.cleaning-table td.today{background:var(--blue-bg)}
.schedule-table th.today,.cleaning-table th.today{background:var(--blue)}

/* logo */
.logo{display:block;flex:none;aspect-ratio:200/209;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
#login .logo{position:absolute;top:.5rem;left:.5rem;width:88px}
header strong{display:flex;align-items:center;white-space:nowrap;min-width:0}

@media(max-width:600px){

header>span:last-child{display:flex;align-items:center;gap:.7rem;flex:0 0 auto;min-width:0}

header>span:last-child .btn{white-space:nowrap;flex:none}
#out{margin-left:.4rem}

/* liquid glass */
:root{--sheen:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 35%,rgba(255,255,255,0) 60%,rgba(255,255,255,.22));--rim:rgba(255,255,255,.8);--dent:rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){:root{--sheen:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 35%,rgba(255,255,255,0) 60%,rgba(255,255,255,.08));--rim:rgba(255,255,255,.28);--dent:rgba(0,0,0,.35)}}
.card,header,.credits{-webkit-backdrop-filter:blur(18px) saturate(1.8) brightness(1.06);backdrop-filter:blur(18px) saturate(1.8) brightness(1.06);background:var(--sheen),var(--card);border-color:var(--rim);box-shadow:0 10px 32px var(--shadow),inset 0 1px 0 var(--rim),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 22px rgba(255,255,255,.07)}
.card.ann{background:var(--sheen),linear-gradient(var(--amber-bg),var(--amber-bg)),var(--card)}
.card.ann.hw{background:var(--sheen),linear-gradient(var(--blue-bg),var(--blue-bg)),var(--card)}
.card.ann.test{background:var(--sheen),linear-gradient(rgba(221,51,51,.16),rgba(221,51,51,.16)),var(--card)}
.card.ann.exam{background:var(--sheen),rgba(255,255,255,.94)}

/* buttons press like a drop of liquid */
.btn,nav button{transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,filter .2s}
.btn:active,nav button:active{transform:scale(.95)}
.btn:not(.ghost){background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 18px rgba(31,111,235,.35)}
.btn.ghost{background:var(--sheen),var(--field);border-color:var(--rim);box-shadow:inset 0 1px 0 var(--rim)}
nav button{background:var(--sheen),var(--card);border-color:var(--rim);box-shadow:0 4px 14px var(--shadow),inset 0 1px 0 var(--rim)}
nav button.on{background:var(--sheen),rgba(50,115,240,.82);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:0 6px 20px rgba(31,111,235,.45),inset 0 1px 0 rgba(255,255,255,.6)}

/* fields look pressed into the glass */
input:not([type=checkbox]),textarea,select{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--field);border:1px solid var(--line);box-shadow:inset 0 2px 6px var(--dent),inset 0 1px 0 rgba(255,255,255,.12);transition:box-shadow .2s,border-color .2s}
input:not([type=checkbox]):focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 2px 6px var(--dent),0 0 0 3px var(--blue-bg),0 0 18px var(--blue-bg)}

/* phones: one blur on the menu bar instead of one per button */
@media(max-width:700px){
  nav{background:var(--veil);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8)}
  nav button{-webkit-backdrop-filter:none;backdrop-filter:none}
}


/* ===== polish + light motion: transform/opacity only, plays once ===== */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,select,input[type=checkbox]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{letter-spacing:-.01em}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{50%{opacity:.45}}
.in{animation:rise .38s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
#login .card,#gate .card{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}
.sk{height:84px;display:grid;place-items:center;color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.bar{height:8px;border-radius:99px;background:rgba(221,51,51,.35);overflow:hidden;margin:.5rem 0 .2rem}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green);transform-origin:left;transform:scaleX(var(--w,1))}
.in .bar i{animation:grow .7s cubic-bezier(.2,.7,.2,1) .15s backwards}
.chips{display:flex;gap:.4rem;margin:.6rem 0 .2rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--field);padding:.3rem .85rem;border-radius:99px;cursor:pointer;font-size:.8rem;min-height:32px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:4.2rem;transform:translate(-50%,14px);max-width:90vw;padding:.6rem 1rem;border-radius:99px;background:var(--text);color:var(--bg);font-size:.85rem;opacity:0;pointer-events:none;z-index:20;transition:opacity .25s,transform .25s cubic-bezier(.2,.7,.2,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){.card.ann{transition:transform .2s}.card.ann:hover{transform:translateY(-2px)}}
/* lighter glass: fewer blurred layers */
.card,header,.credits{-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5)}
.card.ann,nav button{-webkit-backdrop-filter:none;backdrop-filter:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* schedule logo */
.brand-row{display:flex;align-items:center;gap:1rem}
.brand-row .logo{width:76px}
.brand-row>div{min-width:0;flex:1}
@media(max-width:700px){.brand-row{gap:.6rem}.brand-row .logo{width:44px}}
/* attendance */
:root{--green:#1a9a55;--green-bg:rgba(26,154,85,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--green:#4cd08a;--green-bg:rgba(76,208,138,.18)}}
:root[data-theme="dark"]{--green:#4cd08a;--green-bg:rgba(76,208,138,.18)}
.pill{font-size:.75rem;font-weight:700;padding:.15rem .6rem;border-radius:99px;background:var(--field);color:var(--muted)}
.pill.p{background:var(--green-bg);color:var(--green)}
.pill.a{background:rgba(221,51,51,.16);color:var(--danger)}
.att-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:end}.att-top>div{min-width:0}.att-top input{margin-bottom:0;min-width:0;max-width:100%;text-align:left}.att-top .btn{white-space:nowrap;padding:.5rem .9rem;font-size:.85rem;min-height:44px}
.att-sum{display:flex;gap:1rem;flex-wrap:wrap;margin:.8rem 0 .2rem;font-weight:700}
.subj-label{display:block;font-size:.85rem;color:var(--muted);margin:.9rem 0 .35rem}
.subj-chips{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.9rem}
.subj-chips .chip{font-size:.85rem;font-weight:600;padding:.4rem .95rem;min-height:36px}
.subj-chips .chip i{font-style:normal;color:var(--green);margin-left:.3rem}
.subj-chips .chip.on i{color:#fff}
.ic{display:inline-block;width:1.3em;height:1.3em;vertical-align:middle;background:center/contain no-repeat}

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firebaseConfig = {

let db,myRole='student',tab='home';
const me={id:'web',name:''};
const data={ann:[],sched:[],imp:[],att:[]},loaded={};
const SCHEDULE_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday'];
// ---- CONFIG: timetable + cleaning rotation ----
const TIMETABLE={
  Sunday:['Python','HTML','cm','Network','python','sport'],
  Monday:['HTML','Network','Math','CM','Lab','Python'],
  Tuesday:['Network','Python','HTML','ART','Sport','Lab'],
  Wednesday:['Lab','Python','Network','Math','CM','HTML'],

// One pair cleans per institute day (Sun-Thu), in this order, then it loops.
const CLEAN_ROTATION=['Bahez & Zhenar','Husen & Dyari','Matin I & Lawa','Aland & Ali','Asma & Rozyar',
  'Gashbin & Mawada','Nyaz & Zaman','Vana & Zina','Matin A & Dahen','Lana & Muhamad'];
// ---- CONFIG: attendance names (edit this list) ----
const STUDENTS=['1- Bahez Xalid','2- Zhenar Muhamad','3- Husen Ali','4- Dyari Dlzar','5- Matin Ibrahim','6- Lawa Abdulla','7- Aland Hassan','8- Ali Ahmad','9- Asma Jihad','10- Rozyar Hawre','11- Gashbin Muhamad','12- Mawada Abdulrazaq','13- Nyaz Hemn','14- Zaman Zahir','15- Vana Hemn','16- Zina Fatih','17- Matin Amanj','18- Dahen Nawzad','19- Lana Rebin','20- Muhamad Abdulbast'];
// Firebase console > Project settings > Cloud Messaging > Web Push certificates > Key pair
const VAPID_KEY='';
const CLEAN_START='2026-10-11'; // the Sunday Bahez & Zhenar start cleaning
const DAY_END_HOUR=13; // after this hour (24h) the home page switches to the next institute day
const isAdmin=()=>myRole==='admin',isTeacher=()=>myRole==='teacher';

function init(){
  $('gate').classList.add('hidden');
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
  }catch(e){
    $('login').classList.remove('hidden');
    $('lerr').textContent='Could not connect to Firebase: '+(e&&e.message||e);
    return;
  }
  // Realtime sync across every browser
  for(const k of ['ann','sched','imp','att']){
    db.collection(k).onSnapshot(sn=>{
      if(loaded[k]&&k!=='sched'&&k!=='att')sn.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites)notifyNew({id:c.doc.id,...c.doc.data()})});
      loaded[k]=true;
      data[k]=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
      $('me').textContent='Synced online';
      renderSoon();
    },err=>{
      console.error('Firestore sync error ('+k+'):',err);
      $('me').textContent='Sync error: '+(err&&err.code||'unknown');
    });
  }
  let r=null;try{r=localStorage.getItem('tesla_sess')||sessionStorage.getItem('tesla_sess')}catch(e){}
  if(PW[r])enter(r);else $('login').classList.remove('hidden');
}
const PW={student:'student123',teacher:'erbil2026',admin:'prettyboy'};
function enter(r){lastTab=null;myRole=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=r;tab='home';menu();render()}
$('go').onclick=()=>{

  $('lerr').textContent='';
  try{localStorage.removeItem('tesla_sess');sessionStorage.removeItem('tesla_sess');($('rem').checked?localStorage:sessionStorage).setItem('tesla_sess',r)}catch(e){}

$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('out').onclick=()=>{try{localStorage.removeItem('tesla_sess');sessionStorage.removeItem('tesla_sess')}catch(e){}
  $('app').classList.add('hidden');$('login').classList.remove('hidden')};
function allowed(){const t=['home','ann','sched','att','imp','tests'];if(isTeacher()||isAdmin())t.push('upload');return t}
function menu(){
  const L={home:'<span class="ic i-home"></span> <span class="tx">Home</span>',tests:'<span class="ic i-tests"></span> <span class="tx">Quiz/Exam</span>',ann:'<span class="ic i-ann"></span> <span class="tx">Announcements</span>',sched:'<span class="ic i-sched"></span> <span class="tx">Schedule</span>',att:'<span class="ic i-att"></span> <span class="tx">Attendance</span>',imp:'<span class="ic i-imp"></span> <span class="tx">Important</span>',upload:'<span class="ic">📝</span> <span class="tx">Post</span>'};
  $('menu').innerHTML=allowed().map(k=>`<button data-k="${k}" class="${k===tab?'on':''}">${L[k]}</button>`).join('');
  $('menu').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;menu();render()});
}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
async function run(fn){try{await fn()}catch(e){toast('Something went wrong: '+(e&&e.message||e))}}
const canDel=a=>isAdmin()||(isTeacher()&&(a.type==='homework'||a.type==='test'||a.type==='exam'));

let lastTab=null,rq=0;
const renderSoon=()=>{if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}; // batches bursts of realtime updates into one redraw
function render(){
  // Never rebuild the upload form while the user is editing it.
  // Rebuilding the DOM was causing the category/select and text fields to
  // lose their values every time realtime/polling synchronization fired.
  if(tab==='upload' && $('addU')) return;
  if(!me||myRole==='student'&&$('app').classList.contains('hidden'))return;const v=$('view');
  v.innerHTML=({home:homeV,tests:testsV,ann:annV,sched:schedV,att:attV,imp:impV,upload:uploadV}[tab])();
  wire();
  if(tab!==lastTab){lastTab=tab;[...v.children].slice(0,12).forEach((c,i)=>{c.style.setProperty('--i',i);c.classList.add('in')})} // animate only on tab change, never on live updates
}
function annV(){
  if(!loaded.ann)return '<div class="card sk">Loading…</div>';
  if(!data.ann.length)return '<div class="card">No announcements yet.</div>';
  return data.ann.map(a=>{
    const hw=a.type==='homework'||a.type==='test'||a.type==='exam';const f='';
    const label=a.type==='test'?'Quiz':a.type==='exam'?'Exam':'Homework';
    return `<div class="card ann ${a.type==='test'?'test':a.type==='exam'?'exam':hw?'hw':''}"><div class="tag">${hw?label+(a.subject?' · '+esc(a.subject):''):'Announcement'}</div>
    <h3>${esc(a.title)}</h3>${a.body?`<div>${esc(a.body).replace(/\n/g,'<br>')}</div>`:''}
    ${hw&&a.due?`<div class="meta">${a.type==='test'?'Quiz date':a.type==='exam'?'Exam date':'Due'}: ${esc(a.due)}</div>`:''}${f}
    <div class="meta" style="margin-top:.5rem">Posted by ${esc(a.byRole||'staff')} · ${new Date(a.at).toLocaleDateString()} ${canDel(a)?`· <a href="#" data-del="${a.id}" style="color:var(--danger)">Delete</a>`:''}</div></div>`}).join('');
}

const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtShort=s=>fromIso(s).toLocaleDateString('en-US',{month:'long',day:'numeric'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function cleaningFor(date){
  const day=date.getDay();if(day>4)return null;
  const sun=new Date(date.getFullYear(),date.getMonth(),date.getDate()-day);
  const st=fromIso(CLEAN_START);
  const weeks=Math.round((Date.UTC(sun.getFullYear(),sun.getMonth(),sun.getDate())-Date.UTC(st.getFullYear(),st.getMonth(),st.getDate()))/604800000);
  const n=weeks*5+day,len=CLEAN_ROTATION.length;
  return CLEAN_ROTATION[((n%len)+len)%len];
}
// the institute day we show: today until DAY_END_HOUR, then the next one (Fri/Sat are skipped)
function shownDate(){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(d.getDay()<=4&&now.getHours()>=DAY_END_HOUR)d.setDate(d.getDate()+1);
  while(d.getDay()>4)d.setDate(d.getDate()+1);
  return d;
}
function homeV(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const t=shownDate();
  const isToday=t.getTime()===today.getTime(),iso=isoOf(t),dayName=SCHEDULE_DAYS[t.getDay()];
  const heading=t.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  const classes=(TIMETABLE[dayName]||[]).map(cap).join(' → ')||'None';
  const hw=data.ann.filter(x=>x.type==='homework'&&(!x.due||x.due>=iso))
    .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,3)
    .map(x=>esc((x.subject?x.subject+': ':'')+x.title)+(x.due?' <span class="meta">(due '+esc(fmtShort(x.due))+')</span>':''));
  const anns=data.ann.filter(x=>x.type==='announcement').slice(0,2).map(x=>esc(x.title));
  const test=data.ann.filter(x=>(x.type==='test'||x.type==='exam')&&x.due&&x.due>=isoOf(today)).sort((a,b)=>a.due.localeCompare(b.due))[0];
  const line=(ic,label,val)=>`<div style="padding:.4rem 0;border-top:1px solid var(--line)">${ic} <strong>${label}:</strong> ${val}</div>`;
  return `<div class="card"><div class="tag">${isToday?'Today':'Next institute day'}</div>
  <h2 style="margin:.3rem 0 .6rem">${heading}</h2>
  ${line('📚',isToday?'Today':dayName,esc(classes))}
  ${line('📝','Homework',hw.join(' · ')||'None')}
  ${line('🧹','Cleaning',esc(cleaningFor(t)||'None'))}
  ${line('<span class="ic i-ann"></span>','Announcement',anns.join(' · ')||'None')}
  ${line('<span class="ic i-tests"></span>','Next quiz/exam',test?esc((test.subject||test.title)+' — '+fmtShort(test.due)):'None scheduled')}
  </div>`;
}
function testsV(){
  const todayIso=isoOf(new Date());
  const tests=data.ann.filter(x=>x.type==='test'||x.type==='exam').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  if(!loaded.ann)return '<div class="card sk">Loading…</div>';
  if(!tests.length)return '<div class="card">No quizzes or exams yet.</div>';
  const up=tests.filter(x=>!x.due||x.due>=todayIso),past=tests.filter(x=>x.due&&x.due<todayIso).reverse();
  const cardOf=(a,old)=>`<div class="card ann ${a.type==='exam'?'exam':'test'}" ${old?'style="opacity:.6"':''}><div class="tag">${a.type==='exam'?'Exam':'Quiz'}${a.subject?' · '+esc(a.subject):''}${old?' · past':''}</div>
    <h3>${esc(a.title)}</h3>${a.body?`<div>${esc(a.body).replace(/\n/g,'<br>')}</div>`:''}
    ${a.due?`<div class="meta">${a.type==='exam'?'Exam':'Quiz'} date: ${esc(fmtShort(a.due))}</div>`:''}
    <div class="meta" style="margin-top:.5rem">Posted by ${esc(a.byRole||'staff')} · ${new Date(a.at).toLocaleDateString()} ${canDel(a)?`· <a href="#" data-del="${a.id}" style="color:var(--danger)">Delete</a>`:''}</div></div>`;
  return up.map(a=>cardOf(a,false)).join('')+past.map(a=>cardOf(a,true)).join('');
}
function listV(title,items,fmt,delAttr,form){
  const rows=items.map(x=>`<div class="row"><span>${fmt(x)}</span>${isAdmin()?`<button class="btn ghost small" ${delAttr}="${x.id}">Remove</button>`:''}</div>`).join('')||'Nothing yet.';
  return `<div class="card"><h2 style="margin-top:0">${title}</h2>${rows}${isAdmin()?'<hr style="border:0;border-top:1px solid var(--line);margin:1rem 0">'+form:''}</div>`;
}
const SHORT={Sunday:'Sun',Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu'};
const todayName=()=>SCHEDULE_DAYS[shownDate().getDay()];
const dayTh=d=>`<th class="${d===todayName()?'today':''}"><span class="full">${d}</span><span class="short">${SHORT[d]}</span></th>`;
const cell=(d,t)=>`<td class="${d===todayName()?'today':''}">${esc(t).replace(/&amp;/g,' &amp; ')}</td>`;
const schedV=()=>{
  const exact=TIMETABLE;

  // cleaning pair for each day of the shown week
  const sun=shownDate();sun.setDate(sun.getDate()-sun.getDay());
  const cleaning=SCHEDULE_DAYS.map((d,i)=>cleaningFor(new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+i)));

  let table='<div class="card schedule-card"><div class="schedule-brand brand-row"><span class="logo" role="img" aria-label="Institute logo"></span><div><div class="schedule-institute">HAWLER VOCATIONAL INSTITUTE</div><div class="schedule-class">TESLA CLASS</div><div class="schedule-title">WEEKLY SCHEDULE</div></div></div><div><table class="schedule-table"><thead><tr>'+SCHEDULE_DAYS.map(dayTh).join('')+'</tr></thead><tbody>';
  for(let i=0;i<6;i++) table+='<tr>'+SCHEDULE_DAYS.map(d=>cell(d,exact[d][i])).join('')+'</tr>';
  table+='</tbody></table></div></div>';

  let cleaningTable='<div class="schedule-section-gap"></div><div class="card cleaning-schedule-card"><div class="cleaning-brand brand-row"><span class="logo" role="img" aria-label="Institute logo"></span><div><div class="cleaning-institute">HAWLER VOCATIONAL INSTITUTE</div><div class="cleaning-class">TESLA CLASS</div><div class="cleaning-title">CLEANING SCHEDULE</div></div></div><div><table class="cleaning-table"><thead><tr>'+SCHEDULE_DAYS.map(dayTh).join('')+'</tr></thead><tbody>';
  cleaningTable+='<tr>'+SCHEDULE_DAYS.map((d,i)=>cell(d,cleaning[i])).join('')+'</tr>';
  cleaningTable+='</tbody></table></div><div class="cleaning-footer">HAWLER VOCATIONAL INSTITUTE &nbsp; | &nbsp; TESLA CLASS</div></div>';

  return table+cleaningTable;
};

// ---- Attendance ----
// Firestore: collection 'att', one doc per date (id = YYYY-MM-DD), field 'absent' = array of names.
// Doc exists = attendance taken; anyone not in 'absent' is present.
let attDate=null,attSubj=null;
const lastDay=()=>{const d=new Date();d.setHours(0,0,0,0);while(d.getDay()>4)d.setDate(d.getDate()-1);return isoOf(d)};
const canMark=()=>isTeacher()||isAdmin();
let attFilter='all';
// ---- CONFIG: nice subject names (timetable text is matched case-insensitively) ----
const SUBJECT_NAMES={cm:'CM',html:'HTML',python:'Python',network:'Network',lab:'Lab',math:'Math',sport:'Sport',religion:'Religion',art:'Art'};
const subjName=s=>SUBJECT_NAMES[String(s).trim().toLowerCase()]||String(s).trim();
const subjKey=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
// Subjects taught on a given date (from the timetable). A subject taught twice is split: "Python 1", "Python 2".
// Weekend dates fall back to every subject.
const ALL='All day';
function subjectsFor(iso){
  const pool=TIMETABLE[fromIso(iso).toLocaleDateString('en-US',{weekday:'long'})]||[].concat(...Object.values(TIMETABLE));
  const names=pool.map(subjName).filter(Boolean);
  const count={};names.forEach(n=>count[n.toLowerCase()]=(count[n.toLowerCase()]||0)+1);
  const seen={},out=[];
  names.forEach(n=>{const k=n.toLowerCase();
    if(count[k]>1){seen[k]=(seen[k]||0)+1;out.push(n+' '+seen[k])}
    else if(!seen[k]){seen[k]=1;out.push(n)}});
  return out;
}
// Firestore: collection 'att', one doc per date + subject (id = YYYY-MM-DD__subject), field 'absent' = array of names.
// "All day" is not its own record: it writes the same change to every subject doc of that date.
// Old whole-day docs (id = YYYY-MM-DD) still show up as an "Old record" tab.
const attId=(iso,subj)=>subj?iso+'__'+subjKey(subj):iso;
const OLD='Old record';
const idsFor=()=>subjectsFor(attDate).map(s=>attId(attDate,s));
function attV(){
  if(!attDate)attDate=lastDay();
  const subs=subjectsFor(attDate),legacy=data.att.some(x=>x.id===attDate);
  const tabs=subs.slice();if(legacy)tabs.push(OLD);tabs.push(ALL);
  if(!tabs.includes(attSubj))attSubj=tabs[0];
  const isAll=attSubj===ALL;
  // distinct days missed per student (a whole day counts once, not once per subject)
  const days={};data.att.forEach(d=>{const day=String(d.id).slice(0,10);(d.absent||[]).forEach(n=>(days[n]=days[n]||new Set()).add(day))});
  const totals={};Object.keys(days).forEach(n=>totals[n]=days[n].size);
  const label=fromIso(attDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  let taken,k,N,nP,nA,nPart,absList,show,state;
  if(isAll){
    const docs=idsFor().map(id=>data.att.find(x=>x.id===id));
    N=subs.length;taken=docs.some(Boolean);
    k=n=>docs.filter(d=>d&&(d.absent||[]).includes(n)).length;
    state=n=>k(n)===N?'a':k(n)>0?'x':'p';
    nA=STUDENTS.filter(n=>state(n)==='a').length;nPart=STUDENTS.filter(n=>state(n)==='x').length;nP=STUDENTS.length-nA-nPart;
    absList=STUDENTS.filter(n=>state(n)==='a');
    show=n=>attFilter==='all'||!taken||(attFilter==='absent')===(state(n)!=='p');
  }else{
    const curId=attSubj===OLD?attDate:attId(attDate,attSubj);
    const doc=data.att.find(x=>x.id===curId),absent=new Set((doc&&doc.absent)||[]);
    taken=!!doc;state=n=>absent.has(n)?'a':'p';
    absList=STUDENTS.filter(n=>absent.has(n));nA=absList.length;nP=STUDENTS.length-nA;nPart=0;
    show=n=>attFilter==='all'||!taken||(attFilter==='absent')===absent.has(n);
  }
  const rows=STUDENTS.map((n,i)=>{
    if(!show(n))return '';
    const st=state(n),c=totals[n]||0;
    const pill=!taken?'<span class="pill">Not taken</span>':st==='a'?'<span class="pill a">Absent</span>':st==='x'?`<span class="pill" style="background:rgba(240,185,85,.18);color:var(--amber)">Absent ${k(n)}/${N}</span>`:'<span class="pill p">Present</span>';
    const btn=canMark()?`<button class="btn ghost small" data-att="${i}" data-to="${st==='a'?'p':'a'}">${st==='a'?'Mark present':'Mark absent'}</button>`:'';
    return `<div class="row"><span>${esc(n)} ${c?`<span class="meta">· ${c} day${c>1?'s':''} absent</span>`:''}</span><span style="display:flex;gap:.5rem;align-items:center">${pill}${btn}</span></div>`}).join('')||'<div class="meta" style="padding:.6rem 0">No one here.</div>';
  const what=isAll?'the whole day':attSubj;
  const sum=taken
    ?`<div class="att-sum"><span style="color:var(--green)">✅ Present: ${nP}</span><span style="color:var(--danger)">❌ Absent: ${nA}</span>${nPart?`<span style="color:var(--amber)">⚠ Partial: ${nPart}</span>`:''}</div><div class="bar"><i style="--w:${(nP/STUDENTS.length).toFixed(3)}"></i></div>${nA?`<div class="meta">Absent${isAll?' all day':''}: ${absList.map(esc).join(', ')}</div>`:'<div class="meta">Everyone is here.</div>'}`
    :`<div class="att-sum meta">Attendance not taken yet for ${esc(what)}.</div>`;
  const chips=taken?`<div class="chips">${[['all','All'],['absent','Absent'],['present','Present']].map(([k2,t])=>`<button class="chip ${attFilter===k2?'on':''}" data-af="${k2}">${t}</button>`).join('')}</div>`:'';
  const subjBar=`<span class="subj-label">Subject</span><div class="subj-chips">${tabs.map(t=>{
    const done=t===ALL?idsFor().some(id=>data.att.some(x=>x.id===id)):data.att.some(x=>x.id===(t===OLD?attDate:attId(attDate,t)));
    return `<button class="chip ${t===attSubj?'on':''}" data-as="${esc(t)}">${t===ALL?'🗓 ':''}${esc(t)}${done&&t!==ALL?'<i>✓</i>':''}</button>`}).join('')}</div>`;
  return `<div class="card"><h2 style="margin-top:0">Attendance</h2>
  ${subjBar}
  <div class="att-top"><div><label>Date</label><input id="attD" type="date" value="${attDate}"></div>${canMark()?'<button class="btn" id="attAll">Everyone present</button>':''}</div>
  <div class="meta" style="margin-top:.4rem">${esc(label)} · ${esc(isAll?'All subjects':attSubj)}</div>${sum}${chips}
  <hr style="border:0;border-top:1px solid var(--line);margin:.8rem 0 .2rem">${rows}</div>`;
}
const curAttId=()=>attSubj===OLD?attDate:attId(attDate,attSubj);
// Write to one subject doc, or (All day) to every subject doc of the date in one batch.
function attWrite(mk){
  if(attSubj!==ALL)return db.collection('att').doc(curAttId()).set({subject:attSubj,date:attDate,...mk(),by:myRole,at:Date.now()},{merge:true});
  const batch=db.batch();
  subjectsFor(attDate).forEach(s=>batch.set(db.collection('att').doc(attId(attDate,s)),{subject:s,date:attDate,...mk(),by:myRole,at:Date.now()},{merge:true}));
  return batch.commit();
}
const setAbsent=(name,abs)=>attWrite(()=>({absent:abs?firebase.firestore.FieldValue.arrayUnion(name):firebase.firestore.FieldValue.arrayRemove(name)}));
const allPresent=()=>attWrite(()=>({absent:[]}));

const allImportant=()=>[
  ...data.imp.map(x=>({...x,type:'important',legacy:true})),
  ...data.ann.filter(x=>x.type==='important')
].sort((a,b)=>(b.at||0)-(a.at||0));

const impV=()=>listV('Important',allImportant(),x=>`<strong>${esc(x.title||x.text||'')}</strong>${x.body?`<div style="margin-top:.25rem">${esc(x.body).replace(/\n/g,'<br>')}</div>`:''}`,'data-di',
  `<p class="meta">Important posts are shared with every user.</p>`);

const uploadV=()=>`<div class="card"><h2 style="margin-top:0">Upload / Post</h2>
<label>Type</label>
<select id="ut" style="width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:.25rem 0 .8rem">
<option value="important">Important</option>
<option value="homework">Homework</option>
<option value="test">Quiz</option>
<option value="exam">Exam</option>
<option value="announcement">Announcement</option>
</select>
<div id="homeworkFields" class="hidden">
<label>Subject</label><input id="hs">
<label id="hdl">Due date</label><input id="hd" type="date">
</div>
<label>Title</label><input id="utitle" placeholder="Title">
<label>Message / Instructions (optional)</label><textarea id="ub" rows="5" placeholder="Optional — add the announcement, important note, or homework instructions"></textarea>
<div class="err" id="uerr"></div>
<button class="btn" id="addU">Publish</button></div>`;

const hwV=uploadV;
const postV=uploadV;

function wire(){
  const q=s=>document.querySelectorAll(s),v=id=>$(id)&&$(id).value.trim();
  q('[data-del]').forEach(a=>a.onclick=e=>{e.preventDefault();run(()=>db.collection('ann').doc(a.dataset.del).delete())});
  q('[data-di]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.di,col=data.ann.find(x=>x.id===id)?'ann':'imp';
    run(()=>db.collection(col).doc(id).delete());
  });
  q('[data-att]').forEach(b=>b.onclick=()=>run(()=>setAbsent(STUDENTS[+b.dataset.att],b.dataset.to==='a')));
  q('[data-af]').forEach(b=>b.onclick=()=>{attFilter=b.dataset.af;render()});
  if($('attD'))$('attD').onchange=e=>{if(e.target.value){attDate=e.target.value;render()}};
  q('[data-as]').forEach(b=>b.onclick=()=>{attSubj=b.dataset.as;attFilter='all';render()});
  if($('attAll'))$('attAll').onclick=()=>run(allPresent);
  if($('ut'))$('ut').onchange=()=>{const x=$('ut').value,s=x==='homework'||x==='test'||x==='exam';$('homeworkFields').classList.toggle('hidden',!s);$('hdl').textContent=x==='test'?'Quiz date':x==='exam'?'Exam date':'Due date'};

  if($('addU'))$('addU').onclick=()=>run(async()=>{
    const type=$('ut').value,title=v('utitle'),body=$('ub').value.trim(),err=$('uerr');
    if(!title){err.textContent='Please add a title.';return}
    const sh=type==='homework'||type==='test'||type==='exam';
    if(sh&&!v('hs')){err.textContent='Please add the subject.';return}
    if((type==='test'||type==='exam')&&!v('hd')){err.textContent='Please add the '+(type==='test'?'quiz':type)+' date.';return}
    $('addU').disabled=true;err.textContent='Publishing…';

    try{
      await db.collection('ann').add({type,subject:sh?v('hs'):'',title,body,due:sh?v('hd'):'',byRole:myRole,at:Date.now()});
      toast('Published ✓');tab=type==='important'?'imp':(type==='test'||type==='exam')?'tests':'ann';menu();render();
    }catch(e){
      err.textContent='Could not publish: '+(e&&e.message||e);$('addU').disabled=false;
    }
  });
}

// ---- Notifications ----
const notifOn=()=>'Notification' in window&&Notification.permission==='granted';
function notifBtn(){const b=$('notif');if(b)b.innerHTML='<span class="ic i-bell"></span>'+(notifOn()?' On':'')}
async function showNote(title,body,tag){
  try{const reg=await navigator.serviceWorker.getRegistration();
    if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}
}
function notifyNew(x){
  if(!notifOn()||!document.hidden)return; // visible page already shows it live
  const kind={homework:'New homework',test:'New quiz',exam:'New exam',important:'Important',announcement:'New announcement'}[x.type]||'New post';
  const body=x.body?String(x.body).slice(0,120):(x.subject||x.due||'');
  showNote(kind+': '+(x.title||x.text||''),body,x.id);
}
async function enableNotifs(){
  if(!('Notification' in window)){alert('This browser does not support notifications. On iPhone/iPad: tap Share > Add to Home Screen, then open Project Tesla from the home screen and tap 🔔.');return}
  if(Notification.permission==='denied'){alert('Notifications are blocked. Allow them for this site in your browser settings, then tap 🔔 again.');return}
  const perm=await Notification.requestPermission();notifBtn();
  if(perm!=='granted')return;
  let reg=null;try{reg=await navigator.serviceWorker.register('firebase-messaging-sw.js')}catch(e){console.warn('SW failed',e)}
  try{
    if(VAPID_KEY&&reg&&firebase.messaging.isSupported()){
      const token=await firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
      if(token)await db.collection('tokens').doc(token).set({role:myRole,at:Date.now(),ua:navigator.userAgent.slice(0,120)});
    }
  }catch(e){console.warn('Push token failed',e)}
  showNote('Notifications are on','You will be told about new posts, homework, quizzes and exams.','welcome');
}
$('notif').onclick=enableNotifs;
if(notifOn())navigator.serviceWorker&&navigator.serviceWorker.register('firebase-messaging-sw.js').catch(()=>{});
notifBtn();


// redraw when the shown day changes (page left open overnight, or after DAY_END_HOUR)
let shownKey=isoOf(shownDate());
function checkDay(){const k=isoOf(shownDate());if(k!==shownKey){shownKey=k;render()}}
setInterval(checkDay,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});
init();
</script>
